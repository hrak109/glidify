[package]
name = "smoothscroll"
version = "1.0.0"
description = "Smooth trackpad and mouse wheel scrolling for Windows 11"
authors = ["SmoothScroll Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "winuser",
    "mmsystem",
    "winreg",
    "processthreadsapi",
    "psapi",
    "minwindef",
    "handleapi",
    "winbase",
    "timeapi"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
