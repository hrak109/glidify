<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Mouse Silhouette -->
  <rect x="180" y="100" width="152" height="250" rx="76" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>
  
  <!-- Touchpad/Wheel Divider Line -->
  <line x1="256" y1="100" x2="256" y2="180" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  
  <!-- Glowing Scroll Wheel / Trackpad Capsule -->
  <rect x="244" y="130" width="24" height="54" rx="12" fill="url(#wave)" filter="url(#shadow)"/>

  <!-- Smooth Motion Sine Waves / Flow trails -->
  <path d="M 120 370 C 180 320, 220 420, 280 370 C 330 330, 370 410, 410 360" 
        fill="none" stroke="url(#wave)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)"/>
  
  <path d="M 150 420 C 200 380, 240 450, 300 410 C 340 380, 370 430, 390 410" 
        fill="none" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
</svg>
